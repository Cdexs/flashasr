[package]
name = "flashasr-ui"
version = "0.1.0"
description = "flashasr 管理界面"
edition = "2021"

# FLASH-P2b-03：管理界面（独立程序，与前台 flashasr 同目录安装；经本机控制通道跟前台说话）。
# 依赖版本以 voice-ime src-tauri 的锁文件为底（Cargo.lock 由它复制而来）。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
# 大模型统一配置：只改 config.toml 的 [llm] 一节，其余内容与格式原样保留。
toml_edit = "0.22"
# 大模型连接测试（与 voice-ime 设置界面同一份做法）。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 终端用量：只读 usage-stats.sqlite（与引擎共用 src/usage_stats.rs）。
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 共用 src/asr_shared（key 哈希 / 随机数用 ring）+ 配对二维码（只要 SVG 渲染）。
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
# 发版构建必须带：让界面从程序内嵌资源加载（否则会去连开发服务器）。
custom-protocol = ["tauri/custom-protocol"]
